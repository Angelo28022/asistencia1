# Fixed project name so containers and volumes are the same whatever the folder is called.
name: asistencia

services:
  app:
    build: .
    ports:
      - "8090:80"
    environment:
      DB_HOST: db
      DB_NAME: control_asistencia
      DB_USERNAME: asistencia
      DB_PASSWORD: asistencia
    volumes:
      - php_sessions:/var/lib/php/sessions
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    # Same non-strict SQL mode the app was built on (XAMPP): its INSERTs omit
    # NOT NULL columns such as usuarios.email/idmensaje and rely on MariaDB
    # filling '' / 0, which the image's default STRICT_TRANS_TABLES rejects.
    command: --sql-mode=ERROR_FOR_DIVISION_BY_ZERO,NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: control_asistencia
      MARIADB_USER: asistencia
      MARIADB_PASSWORD: asistencia
    volumes:
      - db_data:/var/lib/mysql
      - "./control_asistencia (3).sql:/docker-entrypoint-initdb.d/01-control_asistencia.sql:ro"
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
  php_sessions:
