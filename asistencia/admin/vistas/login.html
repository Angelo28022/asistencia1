<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>SISTEMA ASISTENCIA</title>
    <!-- Tell the browser to be responsive to screen width -->
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <!-- Bootstrap 3.3.5 -->
    <link rel="stylesheet" href="../public/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="../public/css/font-awesome.css">
   
    <!-- Theme style -->
    <link rel="stylesheet" href="../public/css/AdminLTE.min.css">
    <!-- iCheck -->
    <link rel="stylesheet" href="../public/css/blue.css">
    <link rel="shortcut icon" href="../public/img/escudo-256.png">

    <!-- FUENTES GOOGLE -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../public/css/actualizacion.css?v=1">
    <link rel="stylesheet" href="../public/css/responsive.css?v=6">


  </head>
  <body class="hold-transition login-page">

    <div class="login-box">
      <div class="login-logo">
       <img src="../public/img/escudo-256.png" alt="Escudo del Liceo Santa Rosa de Lima" class="login-crest">
       <a href="login.html"><b>"Liceo. Santa Rosa De Lima "</b></a>
      </div><!-- /.login-logo -->
      <div class="login-box-body">
        <p class="login-box-msg">Ingrese sus datos de Acceso</p>
        <form method="post" id="frmAcceso">
          <div class="form-group">
            <label for="logina">Usuario</label>
            <input type="text" id="logina" name="logina" class="form-control" placeholder="Usuario">
          </div>
          <div class="form-group">
            <label for="clavea">Password</label>
            <div class="login-password-field">
              <input type="password" id="clavea" name="clavea" class="form-control" placeholder="Password">
              <button type="button" class="login-toggle-pass" id="btnTogglePass" aria-label="Mostrar contraseña">
                <i class="fa fa-eye" aria-hidden="true"></i>
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-flat">Ingresar</button>
        </form>

      </div><!-- /.login-box-body -->
    </div><!-- /.login-box -->

    <div class="text-center" style="margin-top:5px;">
      <button type="button" 
              class="btn btn-secondary btn-sm" 
              id="btnExtra" 
              style="width:150px;">
        <b>REGRESAR AL INICIO</b>
      </button>
    </div>

    <!-- jQuery -->
    <script src="../public/js/jquery-3.1.1.min.js"></script>
    <!-- Bootstrap 3.3.5 -->
    <script src="../public/js/bootstrap.min.js"></script>
     <!-- Bootbox -->
    <script src="../public/js/bootbox.min.js"></script>

    <script type="text/javascript" src="scripts/login.js"></script>
    <script>
      document.getElementById('btnExtra').onclick = function() {
        window.location.href = '../../vistas/asistencia.php';
      };
    </script>
    <script>
      // Show/hide password: only toggles the input's type and the button's
      // icon/label, does not touch login.js's own submit/verification flow.
      (function () {
        var btn = document.getElementById('btnTogglePass');
        var input = document.getElementById('clavea');
        if (!btn || !input) return;
        btn.addEventListener('click', function () {
          var showing = input.type === 'text';
          input.type = showing ? 'password' : 'text';
          btn.setAttribute('aria-label', showing ? 'Mostrar contraseña' : 'Ocultar contraseña');
          btn.querySelector('i').className = showing ? 'fa fa-eye' : 'fa fa-eye-slash';
        });
      })();
    </script>


  </body>
</html>
